<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>播放控制 3 款金屬質感</title>
<style>
  :root{--accent:#7e57ff;--accent2:#22d3ee}
  *{box-sizing:border-box}
  body{margin:0;padding:30px 18px;background:linear-gradient(135deg,#0a0a14,#1a1a2e);color:#eaeaf2;font-family:-apple-system,'Microsoft JhengHei',sans-serif;min-height:100vh}
  h1{text-align:center;font-weight:300;letter-spacing:2px;margin-bottom:30px}
  .demo{max-width:520px;margin:0 auto 36px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:30px 18px;text-align:center}
  .demo h3{margin:0 0 4px}
  .demo .desc{font-size:12px;color:#888;line-height:1.6;margin-bottom:22px}
  .row{display:flex;align-items:center;justify-content:center;gap:18px}
  button{border:0;cursor:pointer;background:transparent;padding:0}

  /* ① 拋光鈦銀 - 漸層立體 + 內陰影 */
  .v1 .ctrl-btn{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#f0f0f5,#aeaeb6 40%,#5a5a64 80%,#2a2a34);box-shadow:inset 0 -2px 4px rgba(0,0,0,.5),inset 0 2px 3px rgba(255,255,255,.5),0 4px 14px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#0a0a14;font-size:18px;font-weight:900}
  .v1 .ctrl-btn.play{width:74px;height:74px;background:radial-gradient(circle at 30% 25%,#fff,#cfc4ff 40%,#7e57ff 80%,#3d1f9a);color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5);font-size:26px}
  .v1 .ctrl-btn svg{filter:drop-shadow(0 1px 1px rgba(255,255,255,.6))}

  /* ② 黑鉻削邊 - 雙層金屬 + 切角光澤 */
  .v2 .ctrl-btn{width:58px;height:58px;border-radius:14px;background:linear-gradient(135deg,#454553 0%,#1a1a22 50%,#3a3a44 100%);position:relative;display:flex;align-items:center;justify-content:center;color:#e8e8ef;font-size:20px;box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(0,0,0,.7)}
  .v2 .ctrl-btn::before{content:'';position:absolute;inset:2px;border-radius:11px;background:linear-gradient(180deg,rgba(255,255,255,.08) 0%,transparent 50%);pointer-events:none}
  .v2 .ctrl-btn.play{width:76px;height:76px;background:linear-gradient(135deg,#22d3ee 0%,#7e57ff 100%);color:#fff;box-shadow:0 8px 26px color-mix(in srgb,var(--accent) 50%,transparent),inset 0 1px 0 rgba(255,255,255,.4)}

  /* ③ 拉絲玫瑰金 - 細紋 + 暖色金屬 */
  .v3 .ctrl-btn{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#f5d5c2 0%,#d9a08a 35%,#a86650 75%,#7d4838);position:relative;display:flex;align-items:center;justify-content:center;color:#2a1410;box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 2px 3px rgba(255,255,255,.5),inset 0 -2px 3px rgba(0,0,0,.4);font-size:18px}
  .v3 .ctrl-btn::after{content:'';position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px);pointer-events:none}
  .v3 .ctrl-btn.play{width:78px;height:78px;background:linear-gradient(135deg,#fff5ed 0%,#ffc8a2 30%,#ff7a4a 70%,#d04515);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
</style>
</head>
<body>
<h1>♪ 播放控制 — 3 款金屬質感</h1>

<div class="demo v1">
  <h3>① 拋光鈦銀</h3>
  <div class="desc">徑向漸層仿拋光金屬球面,中央高光 + 邊緣陰影,播放鍵改紫色立體</div>
  <div class="row">
    <button class="ctrl-btn"><svg viewBox="0 0 24 24" width="22" height="22"><polygon points="18,5 7,12 18,19" fill="currentColor"/><rect x="5" y="5" width="2" height="14" fill="currentColor"/></svg></button>
    <button class="ctrl-btn play"><svg viewBox="0 0 24 24" width="32" height="32"><polygon points="7,4 21,12 7,20" fill="currentColor"/></svg></button>
    <button class="ctrl-btn"><svg viewBox="0 0 24 24" width="22" height="22"><polygon points="6,5 17,12 6,19" fill="currentColor"/><rect x="17" y="5" width="2" height="14" fill="currentColor"/></svg></button>
  </div>
</div>

<div class="demo v2">
  <h3>② 黑鉻削邊</h3>
  <div class="desc">方形圓角金屬塊,雙層光澤 + 立體陰影,播放鍵漸層發光</div>
  <div class="row">
    <button class="ctrl-btn"><svg viewBox="0 0 24 24" width="24" height="24"><polygon points="18,5 7,12 18,19" fill="currentColor"/><rect x="5" y="5" width="2" height="14" fill="currentColor"/></svg></button>
    <button class="ctrl-btn play"><svg viewBox="0 0 24 24" width="34" height="34"><polygon points="7,4 21,12 7,20" fill="currentColor"/></svg></button>
    <button class="ctrl-btn"><svg viewBox="0 0 24 24" width="24" height="24"><polygon points="6,5 17,12 6,19" fill="currentColor"/><rect x="17" y="5" width="2" height="14" fill="currentColor"/></svg></button>
  </div>
</div>

<div class="demo v3">
  <h3>③ 拉絲玫瑰金</h3>
  <div class="desc">玫瑰金漸層球體 + 對角線拉絲紋,溫潤奢華,播放鍵改橘紅高亮</div>
  <div class="row">
    <button class="ctrl-btn"><svg viewBox="0 0 24 24" width="24" height="24"><polygon points="18,5 7,12 18,19" fill="currentColor"/><rect x="5" y="5" width="2" height="14" fill="currentColor"/></svg></button>
    <button class="ctrl-btn play"><svg viewBox="0 0 24 24" width="34" height="34"><polygon points="7,4 21,12 7,20" fill="currentColor"/></svg></button>
    <button class="ctrl-btn"><svg viewBox="0 0 24 24" width="24" height="24"><polygon points="6,5 17,12 6,19" fill="currentColor"/><rect x="17" y="5" width="2" height="14" fill="currentColor"/></svg></button>
  </div>
</div>

</body>
</html>
