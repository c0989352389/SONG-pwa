<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>上下首按鈕 4 款金屬風格</title>
<style>
  body{margin:0;padding:30px 20px;background:linear-gradient(135deg,#0a0a14,#1a1a2e);color:#eaeaf2;font-family:-apple-system,'Microsoft JhengHei',sans-serif;min-height:100vh}
  h1{text-align:center;margin-bottom:30px;font-weight:300;letter-spacing:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;max-width:1100px;margin:0 auto}
  .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:26px 20px;backdrop-filter:blur(20px);text-align:center}
  .card h3{margin:0 0 6px;font-size:18px;font-weight:600}
  .card .desc{font-size:12px;color:#9a9aa6;margin-bottom:20px;line-height:1.5}
  .btns{display:flex;gap:18px;justify-content:center;align-items:center;margin:14px 0 8px}
  .btns button{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
  .btns button:hover{transform:scale(1.08);background:rgba(255,255,255,.12)}
  .btns .play{width:78px;height:78px;background:linear-gradient(135deg,#7e57ff,#22d3ee)}
  .btns svg{width:30px;height:30px}
  .label{font-size:11px;color:#6a6a76;letter-spacing:1px}
</style>
</head>
<body>
<h1>♪ 上一首 / 下一首 — 4 款金屬風格</h1>
<div class="grid">

  <!-- 1. 拉絲銀漸層 (Brushed Silver) -->
  <div class="card">
    <h3>① 拉絲銀</h3>
    <div class="desc">金屬拉絲質感,中央三角形+垂直短桿,風格冷峻精緻</div>
    <div class="btns">
      <button>
        <svg viewBox="0 0 32 32">
          <defs>
            <linearGradient id="bs1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f5f5f7"/>
              <stop offset="40%" stop-color="#9a9aa0"/>
              <stop offset="60%" stop-color="#6a6a72"/>
              <stop offset="100%" stop-color="#cfcfd5"/>
            </linearGradient>
            <pattern id="brush1" width="2" height="1" patternUnits="userSpaceOnUse">
              <rect width="1" height="1" fill="rgba(255,255,255,.15)"/>
            </pattern>
          </defs>
          <polygon points="20,8 8,16 20,24" fill="url(#bs1)" stroke="#2a2a30" stroke-width="0.6" stroke-linejoin="round"/>
          <polygon points="20,8 8,16 20,24" fill="url(#brush1)"/>
          <rect x="22" y="8" width="3" height="16" fill="url(#bs1)" stroke="#2a2a30" stroke-width="0.6"/>
        </svg>
      </button>
      <button class="play">▶</button>
      <button>
        <svg viewBox="0 0 32 32">
          <polygon points="12,8 24,16 12,24" fill="url(#bs1)" stroke="#2a2a30" stroke-width="0.6" stroke-linejoin="round"/>
          <polygon points="12,8 24,16 12,24" fill="url(#brush1)"/>
          <rect x="7" y="8" width="3" height="16" fill="url(#bs1)" stroke="#2a2a30" stroke-width="0.6"/>
        </svg>
      </button>
    </div>
    <div class="label">BRUSHED SILVER</div>
  </div>

  <!-- 2. 烏黑鉻金屬 (Black Chrome) -->
  <div class="card">
    <h3>② 烏黑鉻</h3>
    <div class="desc">深色鉻金屬,雙三角形相扣,如高階音響面板</div>
    <div class="btns">
      <button>
        <svg viewBox="0 0 32 32">
          <defs>
            <linearGradient id="bc1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#5a5a66"/>
              <stop offset="50%" stop-color="#1a1a22"/>
              <stop offset="100%" stop-color="#3a3a44"/>
            </linearGradient>
            <linearGradient id="bcEdge" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#aaaab2"/>
              <stop offset="100%" stop-color="#4a4a52"/>
            </linearGradient>
          </defs>
          <polygon points="22,8 12,16 22,24" fill="url(#bc1)" stroke="url(#bcEdge)" stroke-width="1.2"/>
          <polygon points="14,8 4,16 14,24" fill="url(#bc1)" stroke="url(#bcEdge)" stroke-width="1.2"/>
        </svg>
      </button>
      <button class="play">▶</button>
      <button>
        <svg viewBox="0 0 32 32">
          <polygon points="10,8 20,16 10,24" fill="url(#bc1)" stroke="url(#bcEdge)" stroke-width="1.2"/>
          <polygon points="18,8 28,16 18,24" fill="url(#bc1)" stroke="url(#bcEdge)" stroke-width="1.2"/>
        </svg>
      </button>
    </div>
    <div class="label">BLACK CHROME</div>
  </div>

  <!-- 3. 玫瑰金漸層 (Rose Gold Glow) -->
  <div class="card">
    <h3>③ 玫瑰金</h3>
    <div class="desc">玫瑰金漸層+柔光,圓角三角形,溫潤奢華</div>
    <div class="btns">
      <button>
        <svg viewBox="0 0 32 32">
          <defs>
            <linearGradient id="rg1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffd5c2"/>
              <stop offset="50%" stop-color="#d99a82"/>
              <stop offset="100%" stop-color="#a66652"/>
            </linearGradient>
            <filter id="rgGlow"><feGaussianBlur stdDeviation="0.6"/></filter>
          </defs>
          <polygon points="20,7 8,16 20,25" fill="url(#rg1)" rx="2" stroke="#fff" stroke-width="0.4" stroke-opacity=".5" stroke-linejoin="round"/>
          <rect x="22" y="7" width="3" height="18" rx="1.2" fill="url(#rg1)" stroke="#fff" stroke-width="0.4" stroke-opacity=".5"/>
        </svg>
      </button>
      <button class="play">▶</button>
      <button>
        <svg viewBox="0 0 32 32">
          <polygon points="12,7 24,16 12,25" fill="url(#rg1)" stroke="#fff" stroke-width="0.4" stroke-opacity=".5" stroke-linejoin="round"/>
          <rect x="7" y="7" width="3" height="18" rx="1.2" fill="url(#rg1)" stroke="#fff" stroke-width="0.4" stroke-opacity=".5"/>
        </svg>
      </button>
    </div>
    <div class="label">ROSE GOLD</div>
  </div>

  <!-- 4. 太空鈦銀 (Titanium with Accent Glow) -->
  <div class="card">
    <h3>④ 太空鈦</h3>
    <div class="desc">深鈦銀色+主題色內側發光,科技感,線條剛硬</div>
    <div class="btns">
      <button>
        <svg viewBox="0 0 32 32">
          <defs>
            <linearGradient id="ti1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#d2d2da"/>
              <stop offset="50%" stop-color="#7a7a86"/>
              <stop offset="100%" stop-color="#3a3a44"/>
            </linearGradient>
            <radialGradient id="tiGlow" cx="50%" cy="50%">
              <stop offset="0%" stop-color="#7e57ff" stop-opacity=".7"/>
              <stop offset="100%" stop-color="#7e57ff" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="16" cy="16" r="14" fill="url(#tiGlow)"/>
          <polygon points="21,7 9,16 21,25 21,17 21,15" fill="url(#ti1)" stroke="#1a1a22" stroke-width="0.8" stroke-linejoin="round"/>
          <line x1="23" y1="7" x2="23" y2="25" stroke="url(#ti1)" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="play">▶</button>
      <button>
        <svg viewBox="0 0 32 32">
          <circle cx="16" cy="16" r="14" fill="url(#tiGlow)"/>
          <polygon points="11,7 23,16 11,25 11,17 11,15" fill="url(#ti1)" stroke="#1a1a22" stroke-width="0.8" stroke-linejoin="round"/>
          <line x1="9" y1="7" x2="9" y2="25" stroke="url(#ti1)" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="label">SPACE TITANIUM</div>
  </div>

</div>
</body>
</html>
